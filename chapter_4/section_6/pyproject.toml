[project]
name = "chapter-4-section-6"
version = "0.1.0"
description = "Parallel World Pattern for Article Generation - Multiple LLM sessions with human-in-the-loop decision making"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = [
    "click>=8.3.0",
    "google-genai>=1.45.0",
    "langgraph>=1.0.0",
    "openai>=2.4.0",
    "pydantic>=2.12.2",
    "python-dotenv>=1.1.1",
]

[project.scripts]
parallel-world = "src.parallel_world_cli:main"
analyze-doc = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-mock>=3.15.1",
]
