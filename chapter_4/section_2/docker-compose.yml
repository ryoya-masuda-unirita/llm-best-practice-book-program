version: '3.8'

services:
  # LLM API Server (Backend)
  llm-server:
    container_name: llm-api-server
    image: shibui/llm-best-practice:chapter4_section2_web
    build:
      context: .
      dockerfile: Dockerfile.web
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    env_file:
      - .envrc
    command:
      - uvicorn
      - src.api.llm_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
