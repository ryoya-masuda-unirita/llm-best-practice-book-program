version: '3.8'

services:
  # ChromaDB Vector Database
  chromadb:
    container_name: chromadb-server
    image: chromadb/chroma:1.3.0-amd64
    platform: linux/amd64
    ports:
      - "8002:8000"  # Map to 8002 to avoid conflict with LLM server
    volumes:
      - chromadb-data:/chroma/chroma  # Persistent storage for ChromaDB
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - llm-network

  # LLM API Server (Character Generation)
  llm-server:
    container_name: llm-api-server
    image: shibui/llm-best-practice:chapter4_section1
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - .envrc
    command:
      - uvicorn
      - src.api.llm_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    networks:
      - llm-network

  # Knowledge Base API Server (CQRS - Command/Query)
  knowledge-server:
    container_name: knowledge-api-server
    image: shibui/llm-best-practice:chapter4_section1
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    env_file:
      - .envrc
    command:
      - uvicorn
      - src.api.knowledge_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    restart: unless-stopped
    networks:
      - llm-network

volumes:
  chromadb-data:
    driver: local

networks:
  llm-network:
    driver: bridge
