[project]
name = "llm-best-practice-book-program"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.2"
dependencies = []

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "mypy>=1.17.0",
    "ruff>=0.12.4",
]

[tool.mypy]
show_error_context = true
show_column_numbers = true
ignore_missing_imports = false
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E203"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.uv.workspace]
members = [
    "chapter_2/section_1",
    "chapter_2/section_2",
    "chapter_2/section_3",
    "chapter_2/section_4",
    "chapter_2/section_5",
    "chapter_2/section_6",
    "chapter_2/section_7",
    "chapter_2/section_8",
    "chapter_2/section_9",
    "chapter_2/section_10",
    "chapter_2/section_11",
    "chapter_2/section_12",
    "chapter_2/section_13",
    "chapter_3/section_1",
    "chapter_3/section_2",
    "chapter_3/section_3",
    "chapter_3/section_4",
    "chapter_3/section_5",
    "chapter_3/section_6",
    "chapter_3/section_7",
    "chapter_3/section_9",
    "chapter_3/section_10",
    "chapter_3/section_11",
    "chapter_3/section_12",
    "chapter_3/section_13",
    "chapter_3/section_14",
    "chapter_3/section_15",
    "chapter_3/section_16",
    "chapter_3/section_17",
    "chapter_4/section_1",
    "chapter_4/section_2",
]
