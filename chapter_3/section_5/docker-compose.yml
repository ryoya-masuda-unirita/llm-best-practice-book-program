version: '3.8'

services:
  # LLM API Gateway - Centralized gateway for all LLM requests
  gateway:
    container_name: llm-gateway
    image: shibui/llm-best-practice:chapter3_section5_gateway
    build:
      context: .
      dockerfile: Dockerfile.gateway
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      - GATEWAY_TIMEOUT=${GATEWAY_TIMEOUT:-30.0}
    env_file:
      - .env
    command:
      - uvicorn
      - src.api_gateway.gateway_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    restart: unless-stopped

  # Backend LLM Server - Connects to gateway for LLM requests
  backend:
    container_name: llm-backend
    image: shibui/llm-best-practice:chapter3_section5_backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:8000
      - GATEWAY_URL=http://gateway:8080
      - GATEWAY_TIMEOUT=${GATEWAY_TIMEOUT:-30.0}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    env_file:
      - .env
    command:
      - uvicorn
      - src.api.llm_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    depends_on:
      - gateway

networks:
  default:
    name: llm-gateway-network
