version: '3.8'

services:
  # LLM API Server (Backend)
  llm-server:
    container_name: llm-api-server
    image: shibui/llm-best-practice:chapter3_section4_web
    build:
      context: .
      dockerfile: Dockerfile.web
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - PROXY_URL=http://llm-server:8080
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    env_file:
      - .env
    command:
      - uvicorn
      - src.api.llm_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    networks:
      - llm-network

  # Proxy Server (Frontend)
  proxy-server:
    container_name: llm-proxy-server
    image: shibui/llm-best-practice:chapter3_section4_proxy
    build:
      context: .
      dockerfile: Dockerfile.proxy
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL=http://llm-server:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    env_file:
      - .env
    command:
      - uvicorn
      - src.proxy.proxy_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    restart: unless-stopped
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge
