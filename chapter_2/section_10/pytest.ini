[pytest]
# Pytest configuration for prompt unit testing

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary info for all test outcomes
    -ra
    # Enable strict markers (requires markers to be defined)
    --strict-markers
    # Show warnings
    -W default
    # Color output
    --color=yes

# Markers for organizing tests
markers =
    asyncio: mark test as async test
    integration: mark test as integration test (requires API calls)
    unit: mark test as unit test (no external dependencies)
    slow: mark test as slow running test
    smoke: mark test as smoke test (quick validation)
    regression: mark test as regression test (checks for quality degradation)

# Async settings
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (if using pytest-cov)
# [tool:pytest]
# addopts = --cov=src --cov-report=html --cov-report=term

# Minimum Python version
minversion = 3.11
