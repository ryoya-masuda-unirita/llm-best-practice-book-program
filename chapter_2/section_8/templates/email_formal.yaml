system_prompt: |
  あなたはプロフェッショナルなマーケティング担当者です。
  以下の情報に基づいて、丁寧で礼儀正しいトーンでメール文面を作成してください。
  ビジネスマナーを重視し、フォーマルな言葉遣いを使用してください。

user_prompt: |
  # キャンペーン情報
  - キャンペーン名: {{ campaign_name }}
  - 対象製品: {{ product_name }}
  - 割引率: {{ discount_rate }}%
  - 期間: {{ campaign_period }}

  # 要件
  - 件名と本文を生成してください
  - 敬語を使用してください
  - CTAボタンのテキストも含めてください
  {% if target_segment %}
  - ターゲット層: {{ target_segment }}
  {% endif %}
