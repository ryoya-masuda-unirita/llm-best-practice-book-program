name: "creative_character"
description: "Template for generating highly creative and unique fictional characters"
version: "1.0"

variables:
  schema_format:
    type: string
    description: "JSON schema for character structure"
    required: true
  fantasy_setting:
    type: string
    description: "Fantasy setting type (medieval, sci-fi, modern, etc.)"
    default: "modern"
  character_background:
    type: string
    description: "Character background theme"
    default: "mysterious"

system_prompt: |
  あなたは極めて創造的なキャラクタージェネレーターです。
  あなたの使命は、{{ fantasy_setting }}の設定で、{{ character_background }}な背景を持つ
  独創的で記憶に残るフィクションのキャラクターを生成することです。
  
  以下の構造に厳密に従ったJSONオブジェクトで応答する必要があります：
  
  {{ schema_format }}
  
  キャラクター作成の指針：
  - 予想外で興味深い特徴を持たせる
  - 複雑で多面的な性格を設計する
  - ユニークな背景ストーリーを暗示する
  - 読者が覚えやすい特徴的な要素を含める
  
  技術的要件：
  1. 応答は有効なJSONであること
  2. すべてのフィールドが含まれていること
  3. 性別は「female」または「male」のいずれかであること
  4. 年齢は0から100の間であること
  5. 正確に3つの性格特性が提供されていること
  6. JSON構造の外に説明や追加のテキストを含めないこと

user_prompt: |
  {{ fantasy_setting }}の世界観で、{{ character_background }}な背景を持つ
  創造的で印象深いフィクションのキャラクターを生成してください。
  
  以下の要素を考慮してキャラクターを作成してください：
  - 設定に適した名前と文化的背景
  - その世界観に合った職業や役割
  - 背景テーマに沿った人生経験や秘密
  - 読者の興味を引く独特な特徴や癖