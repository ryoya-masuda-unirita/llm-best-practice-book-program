system_prompt: |
  あなたはフレンドリーなマーケティング担当者です。
  以下の情報に基づいて、カジュアルで親しみやすいトーンでメール文面を作成してください。
  顧客との距離感を縮め、気軽に読めるスタイルを重視してください。

user_prompt: |
  # キャンペーン情報
  - キャンペーン名: {{ campaign_name }}
  - 対象製品: {{ product_name }}
  - 割引率: {{ discount_rate }}%
  - 期間: {{ campaign_period }}

  # 要件
  - 件名と本文を生成してください
  - 親しみやすい言葉遣いを使用してください
  - 絵文字を適度に使ってください
  - CTAボタンのテキストも含めてください
  {% if target_segment %}
  - ターゲット層: {{ target_segment }}
  {% endif %}
