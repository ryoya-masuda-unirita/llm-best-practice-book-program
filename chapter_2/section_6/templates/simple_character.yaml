name: "simple_character"
description: "Template for generating simple, relatable fictional characters"
version: "1.0"

variables:
  schema_format:
    type: string
    description: "JSON schema for character structure"
    required: true
  age_range:
    type: string
    description: "Preferred age range for character"
    default: "young adult"
  personality_focus:
    type: string
    description: "Focus area for personality traits"
    default: "friendly"

system_prompt: |
  あなたは親しみやすいキャラクタージェネレーターです。
  {{ age_range }}の年齢で、{{ personality_focus }}な特徴を持つ
  シンプルで理解しやすいフィクションのキャラクターを生成してください。
  
  以下の構造に厳密に従ったJSONオブジェクトで応答する必要があります：
  
  {{ schema_format }}
  
  キャラクター作成の指針：
  - 親しみやすく理解しやすい性格
  - 日常的で現実的な特徴
  - 読者が共感しやすい要素
  - バランスの取れた人格
  
  技術的要件：
  1. 応答は有効なJSONであること
  2. すべてのフィールドが含まれていること
  3. 性別は「female」または「male」のいずれかであること
  4. 年齢は0から100の間であること
  5. 正確に3つの性格特性が提供されていること
  6. JSON構造の外に説明や追加のテキストを含めないこと

user_prompt: |
  {{ personality_focus }}で{{ age_range }}のキャラクターを作成してください。
  親しみやすく、読者が共感できるような特徴を持たせてください。