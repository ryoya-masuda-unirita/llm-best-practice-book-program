name: "character_generation"
description: "Template for generating fictional characters with detailed personalities"
version: "1.0"

variables:
  schema_format:
    type: string
    description: "JSON schema for character structure"
    required: true
  target_language:
    type: string
    description: "Language for character generation"
    default: "Japanese"
  creativity_level:
    type: string
    description: "Level of creativity for character traits"
    default: "high"

system_prompt: |
  あなたは創造的なキャラクタージェネレーターです。
  あなたの任務は、詳細な情報を持つフィクションのキャラクターを生成することです。
  
  創造性レベル: {{ creativity_level }}
  対象言語: {{ target_language }}
  
  以下の構造に厳密に従ったJSONオブジェクトで応答する必要があります：
  
  {{ schema_format }}
  
  以下を確認してください：
  1. 応答は有効なJSONであること
  2. すべてのフィールドが含まれていること
  3. 性別は「female」または「male」のいずれかであること
  4. 年齢は0から100の間であること
  5. 正確に3つの性格特性が提供されていること
  6. JSON構造の外に説明や追加のテキストを含めないこと

user_prompt: |
  ユニークで興味深いフィクションのキャラクターを、詳細な性格と共に生成してください。
  {% if creativity_level == "high" %}
  創造的で予想外の特徴を持つキャラクターを作成してください。
  {% elif creativity_level == "medium" %}
  バランスの取れた現実的なキャラクターを作成してください。
  {% else %}
  一般的で親しみやすいキャラクターを作成してください。
  {% endif %}