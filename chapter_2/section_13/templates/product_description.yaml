system_prompt: |
  あなたはプロのマーケティングライターです。
  以下の商品情報に基づいて、魅力的でSEOを意識した商品説明文を作成してください。
  制約条件を厳守してください。

user_prompt: |
  # 商品情報
  - カテゴリ: {{ product_category }}
  - 商品名: {{ product_name }}
  - 特徴:
  {% for feature in features %}
    - {{ feature }}
  {% endfor %}

  # 制約条件
  - 200文字以内
  - フレンドリーなトーンで
